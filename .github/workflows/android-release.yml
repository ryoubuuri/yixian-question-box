name: Android release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release version (for example v0.1.0)'
        required: true
        default: v0.1.0
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.version }}
      RELEASE_STORE_FILE: ${{ runner.temp }}/yixian-release.p12
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: yixian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-disabled: true
      - name: Validate release and signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.'; exit 1
          fi
          test -n "$KEYSTORE_BASE64" && test -n "$RELEASE_STORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          chmod 600 "$RELEASE_STORE_FILE"
      - name: Test and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug
      - name: Build signed APK
        run: |
          gradle --no-daemon assembleRelease -PreleaseVersionName="${RELEASE_TAG#v}" -PreleaseVersionCode="$((100 + GITHUB_RUN_NUMBER))"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/yixian-question-box-${RELEASE_TAG}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "一贤题匣 $RELEASE_TAG" --notes-file docs/release-notes.md
          gh release view "$RELEASE_TAG" --json url,assets
      - name: Clean build products
        if: always()
        run: |
          rm -rf app/build build .gradle dist "$RELEASE_STORE_FILE"
          echo 'Build directories and temporary signing material removed. No Actions artifacts or Gradle caches were uploaded.' >> "$GITHUB_STEP_SUMMARY"
